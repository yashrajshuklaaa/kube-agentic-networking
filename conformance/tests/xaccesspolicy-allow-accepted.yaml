apiVersion: agentic.networking.x-k8s.io/v1alpha2
kind: XAccessPolicy
metadata:
  name: xaccesspolicy-allow-accepted
  namespace: agentic-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: conformance-primary
  action: Allow
  rules:
    - name: allow-default
      source:
        type: ServiceAccount
        serviceAccount:
          name: default
          namespace: agentic-conformance-infra
      authorization:
        type: Inline
        headers:
          - name: Mcp-Method
            value: "tools/call"
          - name: Mcp-Name
            value: "get-sum"