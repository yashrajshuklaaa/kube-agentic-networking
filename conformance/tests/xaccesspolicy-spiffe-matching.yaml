apiVersion: agentic.networking.x-k8s.io/v1alpha2
kind: XAccessPolicy
metadata:
  name: xaccesspolicy-spiffe-matching
  namespace: agentic-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: conformance-primary
  action: Allow
  rules:
    - name: allow-tester-spiffe-base
      source:
        type: SPIFFE
        spiffe: spiffe://cluster.local/ns/agentic-conformance-infra/sa/conformance-tester-sa
      authorization:
        type: Inline
        headers:
          - name: Mcp-Method
            type: RegularExpression
            value: "^(initialize|ping|tools/list|completion/.*|logging/.*|notifications/.*)$"
    - name: allow-tester-spiffe-sse-close
      source:
        type: SPIFFE
        spiffe: spiffe://cluster.local/ns/agentic-conformance-infra/sa/conformance-tester-sa
      authorization:
        type: Inline
        methods:
          - GET
          - DELETE
    - name: allow-tester-spiffe
      source:
        type: SPIFFE
        spiffe: spiffe://cluster.local/ns/agentic-conformance-infra/sa/conformance-tester-sa
      authorization:
        type: Inline
        headers:
          - name: Mcp-Method
            value: "tools/call"
          - name: Mcp-Name
            value: "get-sum"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: conformance-route
  namespace: agentic-conformance-infra
spec:
  parentRefs:
    - name: conformance-primary
      namespace: agentic-conformance-infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: conformance-mcp-backend-svc
          port: 3001
