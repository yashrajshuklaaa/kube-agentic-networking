apiVersion: agentic.networking.x-k8s.io/v1alpha2
kind: XAccessPolicy
metadata:
  name: policy-inline-empty-methods
  namespace: default
spec:
  targetRefs:
  - group: agentic.networking.x-k8s.io
    kind: XBackend
    name: my-backend
  action: Allow
  rules:
  - name: inline-empty-methods
    source:
      type: ServiceAccount
      serviceAccount:
        name: my-sa
    authorization:
      type: Inline
      methods: []
