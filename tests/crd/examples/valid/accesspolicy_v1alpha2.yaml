apiVersion: agentic.networking.x-k8s.io/v1alpha2
kind: XAccessPolicy
metadata:
  name: valid-policy-v1alpha2
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: my-gateway
  action: Allow
  rules:
  - name: allow-sa
    source:
      type: ServiceAccount
      serviceAccount:
        name: my-sa
  - name: allow-spiffe
    source:
      type: SPIFFE
      spiffe: spiffe://example.com/my-service
    authorization:
      type: Inline
      headers:
      - name: Mcp-Method
        value: tools/call
      - name: Mcp-Name
        value: param1
