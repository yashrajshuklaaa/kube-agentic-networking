apiVersion: agentic.networking.x-k8s.io/v1alpha2
kind: XAccessPolicy
metadata:
  name: e2e-backend-allow-policy
  namespace: e2e-test-ns
spec:
  targetRefs:
    - group: agentic.networking.x-k8s.io
      kind: XBackend
      name: e2e-mcp-backend
  action: Allow
  rules:
    - name: tools-for-tester-sa
      source:
        type: ServiceAccount
        serviceAccount:
          name: e2e-tester-sa
          namespace: e2e-test-ns
      authorization:
        type: Inline
        headers:
          - name: Mcp-Method
            value: "tools/call"
          - name: Mcp-Name
            type: RegularExpression
            value: "^(echo|get-sum)$"
    - name: base-for-tester-sa
      source:
        type: ServiceAccount
        serviceAccount:
          name: e2e-tester-sa
          namespace: e2e-test-ns
      authorization:
        type: Inline
        headers:
          - name: Mcp-Method
            type: RegularExpression
            value: "^(initialize|ping|tools/list|completion/.*|logging/.*|notifications/.*)$"
    - name: tools-for-tester-2-sa
      source:
        type: ServiceAccount
        serviceAccount:
          name: e2e-tester-2-sa
          namespace: e2e-test-ns
      authorization:
        type: Inline
        headers:
          - name: Mcp-Method
            value: "tools/call"
          - name: Mcp-Name
            type: RegularExpression
            value: "^(echo|get-sum|get-env)$"
    - name: base-for-tester-2-sa
      source:
        type: ServiceAccount
        serviceAccount:
          name: e2e-tester-2-sa
          namespace: e2e-test-ns
      authorization:
        type: Inline
        headers:
          - name: Mcp-Method
            type: RegularExpression
            value: "^(initialize|ping|tools/list|completion/.*|logging/.*|notifications/.*)$"
---
apiVersion: agentic.networking.x-k8s.io/v1alpha2
kind: XAccessPolicy
metadata:
  name: e2e-backend-extauth-policy
  namespace: e2e-test-ns
spec:
  targetRefs:
    - group: agentic.networking.x-k8s.io
      kind: XBackend
      name: e2e-mcp-backend
  action: ExternalAuth
  externalAuth:
    backendRef:
      kind: Service
      name: authorino
      namespace: e2e-test-ns
      port: 50051
    protocol: GRPC
    grpc: {}
  rules:
    - name: external-auth-for-tester-2-sa
      source:
        type: ServiceAccount
        serviceAccount:
          name: e2e-tester-2-sa
          namespace: e2e-test-ns
