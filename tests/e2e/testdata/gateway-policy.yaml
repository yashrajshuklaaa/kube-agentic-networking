apiVersion: agentic.networking.x-k8s.io/v1alpha2
kind: XAccessPolicy
metadata:
  name: e2e-gateway-level-policy
  namespace: e2e-test-ns
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: e2e-gateway
  action: Allow
  rules:
    - name: allow-echo
      source:
        type: ServiceAccount
        serviceAccount:
          name: e2e-tester-sa
          namespace: e2e-test-ns
      authorization:
        type: Inline
        headers:
          - name: Mcp-Method
            value: "tools/call"
          - name: Mcp-Name
            value: "echo"
    - name: allow-base-protocol
      source:
        type: ServiceAccount
        serviceAccount:
          name: e2e-tester-sa
          namespace: e2e-test-ns
      authorization:
        type: Inline
        headers:
          - name: Mcp-Method
            type: RegularExpression
            value: "^(initialize|ping|tools/list|completion/.*|logging/.*|notifications/.*)$"
